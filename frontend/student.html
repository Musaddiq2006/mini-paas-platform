<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Upload Portal</title>
    <link rel="stylesheet" href="student.css">
</head>
<body bgcolor="mediumslateblue">
    <nav>
         <div class="logo">
                <img src="#">SM AHMED'S PaaS
                </img>
            </div>
        <a href="index.html">Home Page</a>
    </nav>
    <section>
         <form>
            <input type="text" placeholder="ENTER PROJECT NAME" id="projectName">
                <select id="techStack">
                <option value="Python" selected>Python (Flask/FastAPI)</option>
                <option value="Java">Java Spring Boot</option>
                <option value="Static HTML">Static HTML/CSS/JS</option>
                <option value="C/C++">C/C++ Web</option>
            </select>
        <br><br>
        <input type="file" id="zipFile">
        <br><br>
        <button type="submit" onclick="handleUpload(event)">
            Upload & Deploy Project
        </button>
        </form>
    </section>
        <br>
    <div class="Deployments">
        <div id="noDeployments" style="background-color: #f8f9fa; border: 1px dashed #cccccc; padding: 15px; text-align: center; margin-top: 15px; border-radius: 5px;">
            <p style="margin: 0; color: #666666;">📁 No active deployments yet. Fill out the form above to deploy your first container!</p>
        </div>
        <table border="1">
           <tr>
            <td>Project Name</td>
            <td>Upload Time</td>
            <td>Port</td>
            <td>Status</td>
            <td><button>View App</button></td>
           </tr> 
        </table>
    </div>
    <footer>
        Engineered by Syed Musaddiq Ahmed - 3rd Year B.E. CSE
        <br>
        Private PaaS Control Plane | Spring Boot & Docker Architecture
    </footer>
    <script src="app.js"></script>
</body>
</html>
